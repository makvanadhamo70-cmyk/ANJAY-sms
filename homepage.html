<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ANJAY - Homepage</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* FIX: Height aur Overflow set kiya */
        html, body {
            width: 100%;
            min-height: 100vh; /* Puri screen bharne ke liye */
            background: #09090b;
            background-image: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #09090b 70%);
            color: #ffffff;
            overflow-y: auto; /* Scroll allow kiya */
            overflow-x: hidden;
            /* position: fixed; HATA DIYA */
        }

        .app-card {
            width: 100%;
            min-height: 100dvh; /* Mobile ke liye perfect height */
            height: auto;
            background: rgba(24, 24, 27, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            position: relative;
        }

        /* Header & Search */
        .app-header {
            padding: 14px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            background: rgba(15, 15, 18, 0.85);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .search-box {
            position: relative;
            flex: 1;
        }

        .search-box input {
            width: 100%;
            padding: 10px 16px 10px 38px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(0, 0, 0, 0.4);
            color: white;
            font-size: 14px;
            outline: none;
        }

        .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #94a3b8; font-size: 14px; }

        /* Main Content Area */
        .tab-content {
            flex: 1; overflow-y: auto; padding: 16px; display: none; flex-direction: column; gap: 12px;
        }
        .tab-content.active { display: flex; }

        /* Section Titles */
        .section-title {
            font-size: 13px; color: #94a3b8; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;
        }

        /* User Item Card */
        .user-item {
            display: flex; align-items: center; gap: 14px; padding: 12px;
            background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px; cursor: pointer; transition: 0.2s; width: 100%;
        }
        .user-item:hover { background: rgba(56, 189, 248, 0.08); }

        .avatar { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; background: #27272a; flex-shrink: 0; }
        .user-info { flex: 1; overflow: hidden; }
        .user-info h4 { font-size: 15px; color: #f8fafc; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .user-info p { font-size: 12px; color: #94a3b8; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .unread-text { font-weight: 800; color: #f8fafc !important; }

        /* Suggestions Header */
        .suggestions-header {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; margin-top: 10px;
        }
        .hide-all-btn { background: none; border: none; color: #ef4444; font-size: 18px; cursor: pointer; padding: 0 5px; }

        /* Settings Card & Buttons */
        .settings-group {
            background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px; padding: 8px; display: flex; flex-direction: column; gap: 4px;
        }
        .setting-item {
            display: flex; justify-content: space-between; align-items: center; padding: 14px;
            border-radius: 12px; cursor: pointer; color: #e2e8f0; font-size: 14px; font-weight: 500;
        }
        .setting-item:hover { background: rgba(255, 255, 255, 0.05); }

        /* Bottom Navigation Bar (4 Tabs) */
        .nav-bar {
            height: 65px; background: rgba(15, 15, 18, 0.95); border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex; justify-content: space-around; align-items: center; z-index: 10;
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 3px; color: #94a3b8; cursor: pointer; font-size: 11px; font-weight: 600; background: none; border: none; flex: 1; }
        .nav-item svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 2; fill: none; }
        .nav-item.active { color: #38bdf8; }
        .nav-item.active svg { stroke: #38bdf8; }

        /* Light Chat Room View Overlay */
        .chat-room {
            position: absolute; top: 0; left: 100%; width: 100%; height: 100%;
            background: #fcfcfc; display: flex; flex-direction: column; z-index: 50; transition: left 0.3s ease-in-out;
        }
        .chat-room.active { left: 0; }

        .chat-room-header {
            padding: 12px 16px; background: #ffffff; border-bottom: 1px solid #f0f0f0;
            display: flex; align-items: center; justify-content: space-between;
        }
        .header-left-part { display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .back-btn { background: none; border: none; color: #000; font-size: 24px; cursor: pointer; }
        .chat-room-header .avatar { width: 40px; height: 40px; border: 1px solid #eee; }
        .chat-header-names h4 { font-size: 15px; color: #000; font-weight: 700; }
        .chat-header-names p { font-size: 11px; color: #888; margin-top: 2px; }

        .header-action-icons { display: flex; gap: 18px; color: #000; align-items: center; }
        .header-action-icons svg { width: 22px; height: 22px; cursor: pointer; }

        .chat-messages {
            flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px;
            background: #fdfafb;
        }

        .msg-row { display: flex; align-items: flex-end; gap: 8px; max-width: 80%; }
        .msg-row.me-row { align-self: flex-end; flex-direction: row-reverse; }
        .msg-row.heshe-row { align-self: flex-start; }
        .msg-avatar { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; }

        .msg-bubble {
            padding: 10px 14px; font-size: 14.5px; line-height: 1.4; word-break: break-word;
            position: relative; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        .msg-bubble.me { background: #f9196b; color: white; border-radius: 20px; border-bottom-right-radius: 4px; }
        .msg-bubble.heshe { background: #ffffff; color: #000000; border: 1px solid #f0f0f0; border-radius: 20px; border-bottom-left-radius: 4px; }

        /* Input Area with Airplane Send */
        .chat-input-area { padding: 10px 16px 15px 16px; background: #ffffff; border-top: 1px solid #f0f0f0; display: flex; align-items: center; }
        .input-pill { flex: 1; display: flex; align-items: center; background: #f1f2f6; border-radius: 30px; padding: 4px 16px; gap: 10px; }
        .input-pill .cam-icon { background: #f9196b; color: white; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 15px; cursor: pointer; }
        .input-pill input { flex: 1; border: none; background: transparent; color: #000; font-size: 15px; padding: 10px 0; outline: none; }
        .send-airplane-btn { background: none; border: none; color: #f9196b; font-size: 24px; cursor: pointer; padding-left: 8px; transform: rotate(45deg); }

        /* Context Menu (Edit / Delete) */
        .context-menu {
            position: fixed; background: #27272a; border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px; padding: 8px; display: none; z-index: 1000; box-shadow: 0 10px 25px rgba(0,0,0,0.5); flex-direction: column; gap: 5px; width: 120px;
        }
        .context-menu button { background: none; border: none; color: white; padding: 10px; text-align: left; border-radius: 8px; cursor: pointer; font-size: 13px; }
        .context-menu button:hover { background: rgba(255,255,255,0.1); }

        /* Account / Instagram Style */
        .instagram-profile { display: flex; flex-direction: column; gap: 20px; padding-top: 10px; }
        .profile-header-insta { display: flex; align-items: center; gap: 20px; }
        .insta-avatar { width: 85px; height: 85px; border-radius: 50%; object-fit: cover; border: 2px solid #38bdf8; cursor: pointer; }
        .insta-stats { display: flex; gap: 20px; flex: 1; justify-content: space-around; text-align: center; }
        .stat-box h3 { font-size: 18px; font-weight: 800; color: #f8fafc; }
        .stat-box p { font-size: 11px; color: #94a3b8; }
        .chat-id-box { background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.08); padding: 12px; border-radius: 14px; display: flex; justify-content: space-between; align-items: center; }
        .copy-btn { background: #38bdf8; color: #09090b; border: none; padding: 6px 12px; border-radius: 8px; font-weight: 700; font-size: 11px; cursor: pointer; }
        .edit-profile-form { display: flex; flex-direction: column; gap: 12px; margin-top: 10px; }
        .edit-profile-form label { font-size: 11px; color: #94a3b8; text-transform: uppercase; font-weight: 600; }
        .edit-profile-form input, .edit-profile-form textarea { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1); background: rgba(0, 0, 0, 0.4); color: white; font-size: 14px; outline: none; }
        .action-btn { background: #38bdf8; border: none; padding: 14px; border-radius: 10px; font-weight: 700; color: #09090b; cursor: pointer; font-size: 12px; }
    </style>
</head>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAJBgC-DTaoKdg_hmnxMAMPM-0tIQ999Js",
            authDomain: "anjay-sms-d7930.firebaseapp.com",
            databaseURL: "https://anjay-sms-d7930-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "anjay-sms-d7930",
            storageBucket: "anjay-sms-d7930.firebasestorage.app",
            messagingSenderId: "726689670179",
            appId: "1:726689670179:web:5ffb3e1f43ccd95db0bd96"
        };

        // FIX: Firebase initialize check
        let database = null;
        try {
            if (typeof firebase !== "undefined" && !firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
                database = firebase.database();
            }
        } catch(error) {
            console.error("Firebase init failed:", error);
        }

        const myChatId = localStorage.getItem('myChatId');
        const myUsername = localStorage.getItem('myUsername');
        let currentChatUser = null;
        let pressTimer; let selectedMsgId = null; let selectedMsgText = "";
        let isSuggestionsHidden = localStorage.getItem('hideAllSuggestionsFlag') === 'true';

        // 🚀 INSTANT LOAD ON STARTUP (FIX: Fallback add kiya)
        window.onload = function() {
            if (!myChatId) { window.location.href = "index.html"; return; }

            // Step 1: Render cached data instantly before waiting for Firebase
            renderCachedChatsAndSuggestions();

            // Step 2: Sync with Live Firebase Data
            if (database) {
                database.ref('users/' + myChatId).once('value').then(snapshot => {
                    if (snapshot.exists()) {
                        const data = snapshot.val();
                        document.getElementById('accountUsername').value = data.username || myUsername;
                        document.getElementById('accountBio').value = data.bio || "";
                        document.getElementById('displayChatId').innerText = myChatId;
                        if (data.pfp) document.getElementById('myProfilePic').src = data.pfp;
                        loadRealtimeChats();
                    } else {
                        // Agar user data nahi mila toh bhi suggestions dikhao
                        loadSuggestions();
                    }
                }).catch(error => {
                    console.error("Firebase read error:", error);
                    loadSuggestions(); // Error aaya toh bhi blank screen nahi dikhegi
                });
            } else {
                // Firebase hi load nahi hua toh bhi UI dikhao
                loadSuggestions();
            }

            document.getElementById("msgInput").addEventListener("keypress", function(event) {
                if (event.key === "Enter") { event.preventDefault(); sendMessage(); }
            });
        };

        // Render Cache Instantly (0 Delay)
        function renderCachedChatsAndSuggestions() {
            const cachedChats = localStorage.getItem('fast_cached_chats');
            const cachedSugg = localStorage.getItem('fast_cached_sugg');

            if (cachedChats) {
                document.getElementById('activeChatsArea').innerHTML = '<span class="section-title">Recent Chats</span>' + cachedChats;
            }
            if (cachedSugg && !isSuggestionsHidden) {
                document.getElementById('chatListArea').innerHTML = cachedSugg;
            }
        }

        function switchTab(tabName, btnElement) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.getElementById(tabName + 'Tab').classList.add('active');
            btnElement.classList.add('active');
        }

        // --- Realtime Sync ---
        function loadRealtimeChats() {
            database.ref(`user_chats/${myChatId}`).on('value', snapshot => {
                const activeArea = document.getElementById('activeChatsArea');
                activeArea.innerHTML = '<span class="section-title">Recent Chats</span>';
                
                if(!snapshot.exists()){
                    activeArea.innerHTML += '<p style="color:#64748b; font-size:12px; margin-top:8px;">No active chats yet.</p>';
                    document.getElementById('chatsCountNum').innerText = "0";
                    if(!isSuggestionsHidden) loadSuggestions();
                    else document.getElementById('suggestionsWrapper').style.display = 'none';
                    return;
                }

                let chatList = [];
                snapshot.forEach(child => { chatList.push({ id: child.key, ...child.val() }); });
                document.getElementById('chatsCountNum').innerText = chatList.length;
                chatList.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

                let promises = chatList.map(chatData => {
                    return database.ref(`users/${chatData.id}`).once('value').then(userSnap => {
                        if(userSnap.exists()) {
                            renderUserCard(chatData.id, userSnap.val(), activeArea, chatData);
                        }
                    });
                });

                Promise.all(promises).then(() => {
                    localStorage.setItem('fast_cached_chats', activeArea.innerHTML.replace('<span class="section-title">Recent Chats</span>', ''));
                });

                if(!isSuggestionsHidden) loadSuggestions(chatList.map(c => c.id));
                else document.getElementById('suggestionsWrapper').style.display = 'none';
            });
        }

        function loadSuggestions(existingChatIds = []) {
            const listArea = document.getElementById('chatListArea');
            document.getElementById('suggestionsWrapper').style.display = 'block';
            listArea.innerHTML = '';
            
            database.ref('users').once('value').then(snapshot => {
                snapshot.forEach(child => {
                    const uKey = child.key;
                    if (uKey !== myChatId && !existingChatIds.includes(uKey)) {
                        renderUserCard(uKey, child.val(), listArea, null, true);
                    }
                });
                localStorage.setItem('fast_cached_sugg', listArea.innerHTML);
            });
        }

        function hideAllSuggestions() {
            document.getElementById('suggestionsWrapper').style.display = 'none';
            localStorage.setItem('hideAllSuggestionsFlag', 'true');
            isSuggestionsHidden = true;
        }

        function resetSuggestions() {
            localStorage.removeItem('hideAllSuggestionsFlag');
            isSuggestionsHidden = false;
            loadRealtimeChats();
            alert("Suggestions restored!");
        }

        function clearLocalAppCache() {
            localStorage.removeItem('fast_cached_chats');
            localStorage.removeItem('fast_cached_sugg');
            alert("Cache cleared! App will refresh.");
            location.reload();
        }

        function renderUserCard(targetId, userData, container, chatMeta = null, isSuggestion = false) {
            const item = document.createElement('div');
            item.className = 'user-item';
            
            let displayMsg = isSuggestion ? (userData.bio || 'Tap to start chat') : (chatMeta.lastMsg || 'Tap to chat');
            let isUnread = chatMeta && chatMeta.unread;
            let msgClass = isUnread ? "unread-text" : "";

            item.innerHTML = `
                <img src="${userData.pfp || 'https://via.placeholder.com/52/27272a/38bdf8?text=PFP'}" class="avatar">
                <div class="user-info">
                    <h4>${userData.username || 'Anonymous'}</h4>
                    <p class="${msgClass}">${displayMsg}</p>
                </div>
            `;
            item.onclick = () => openChatRoom(targetId, userData.username || 'User', userData.pfp || '');
            container.appendChild(item);
        }

        function searchUsers(query) {
            query = query.trim().toLowerCase();
            if (query === "") {
                document.getElementById('activeChatsArea').style.display = 'block';
                if(!isSuggestionsHidden) document.getElementById('suggestionsWrapper').style.display = 'block';
                loadRealtimeChats(); return;
            }
            
            document.getElementById('activeChatsArea').style.display = 'none';
            document.getElementById('suggestionsWrapper').style.display = 'block';
            document.querySelector('.suggestions-header .section-title').innerText = 'Search Results';
            document.querySelector('.hide-all-btn').style.display = 'none';

            const listArea = document.getElementById('chatListArea');
            listArea.innerHTML = '<p style="text-align:center; color:#94a3b8;">Searching...</p>';

            database.ref('users').once('value').then(snapshot => {
                listArea.innerHTML = ""; let found = false;
                snapshot.forEach(child => {
                    const uData = child.val(); const uKey = child.key;
                    if (uKey !== myChatId) {
                        if (uKey.toLowerCase().includes(query) || (uData.username && uData.username.toLowerCase().includes(query))) {
                            found = true; renderUserCard(uKey, uData, listArea, null, true);
                        }
                    }
                });
                if (!found) listArea.innerHTML = '<p style="text-align:center; color:#64748b;">No user found.</p>';
            });
        }

        // --- CHAT ROOM ---
        function openChatRoom(targetId, targetName, targetPfp) {
            currentChatUser = { id: targetId, name: targetName, pfp: targetPfp || 'https://via.placeholder.com/40/eee/000?text=PFP' };
            
            document.getElementById('activeChatName').innerText = targetName;
            document.getElementById('activeChatIdDisplay').innerText = "@" + targetId;
            document.getElementById('activeChatAvatar').src = currentChatUser.pfp;
            
            document.getElementById('chatRoom').classList.add('active');
            database.ref(`user_chats/${myChatId}/${targetId}`).update({ unread: false });
            listenToMessages(targetId);

            setTimeout(() => { document.getElementById('msgInput').focus(); }, 350);
        }

        function closeChatRoom() {
            document.getElementById('chatRoom').classList.remove('active');
            currentChatUser = null;
        }

        function getChatRoomId(id1, id2) { return id1 < id2 ? `${id1}_${id2}` : `${id2}_${id1}`; }

        function sendMessage() {
            const input = document.getElementById('msgInput');
            const text = input.value.trim();
            if (!text || !currentChatUser) return;

            const roomId = getChatRoomId(myChatId, currentChatUser.id);
            const msgId = database.ref('chats/' + roomId).push().key;
            const now = Date.now();

            const updates = {};
            updates[`chats/${roomId}/${msgId}`] = { sender: myChatId, text: text, timestamp: now };
            updates[`user_chats/${myChatId}/${currentChatUser.id}`] = { timestamp: now, lastMsg: `You: ${text}`, unread: false };
            updates[`user_chats/${currentChatUser.id}/${myChatId}`] = { timestamp: now, lastMsg: text, unread: true };

            database.ref().update(updates).then(() => { 
                input.value = ""; input.focus(); 
            });
        }

        function listenToMessages(targetId) {
            const roomId = getChatRoomId(myChatId, targetId);
            const msgContainer = document.getElementById('chatMessages');
            
            database.ref('chats/' + roomId).on('value', snapshot => {
                msgContainer.innerHTML = "";
                if (!snapshot.exists()) return;

                snapshot.forEach(child => {
                    const msg = child.val(); const msgId = child.key;
                    const isMe = msg.sender === myChatId;
                    
                    const row = document.createElement('div');
                    row.className = isMe ? 'msg-row me-row' : 'msg-row heshe-row';

                    let avatarHtml = !isMe ? `<img src="${currentChatUser.pfp}" class="msg-avatar">` : '';
                    row.innerHTML = avatarHtml + `<div class="msg-bubble ${isMe ? 'me' : 'heshe'}">${msg.text}</div>`;
                    
                    const bubbleElement = row.querySelector('.msg-bubble');
                    bubbleElement.onmousedown = (e) => startPress(msgId, msg.text, isMe, e);
                    bubbleElement.onmouseup = cancelPress;
                    bubbleElement.onmouseleave = cancelPress;
                    bubbleElement.ontouchstart = (e) => startPress(msgId, msg.text, isMe, e.touches[0]);
                    bubbleElement.ontouchend = cancelPress;

                    msgContainer.appendChild(row);
                });
                msgContainer.scrollTop = msgContainer.scrollHeight;
                
                if(currentChatUser && currentChatUser.id === targetId) {
                    database.ref(`user_chats/${myChatId}/${targetId}`).update({ unread: false });
                }
            });
        }

        // --- EDIT / DELETE CONTEXT MENU ---
        function startPress(msgId, text, isMe, e) {
            if (!isMe) return; 
            pressTimer = setTimeout(() => { showContextMenu(msgId, text, e.clientX || e.touches[0].clientX, e.clientY || e.touches[0].clientY); }, 600);
        }
        function cancelPress() { clearTimeout(pressTimer); }
        function showContextMenu(msgId, text, x, y) {
            selectedMsgId = msgId; selectedMsgText = text;
            const menu = document.getElementById('contextMenu');
            menu.style.display = 'flex';
            if(x + 120 > window.innerWidth) x = window.innerWidth - 130;
            if(y + 80 > window.innerHeight) y = window.innerHeight - 90;
            menu.style.left = x + 'px'; menu.style.top = y + 'px';
        }
        function closeContextMenu() { document.getElementById('contextMenu').style.display = 'none'; }
        
        function triggerEditMessage() {
            const newText = prompt("Edit message:", selectedMsgText);
            if(newText && newText.trim() !== "" && currentChatUser) {
                const roomId = getChatRoomId(myChatId, currentChatUser.id);
                database.ref(`chats/${roomId}/${selectedMsgId}`).update({ text: newText.trim() });
                database.ref(`user_chats/${myChatId}/${currentChatUser.id}`).update({ lastMsg: `You: ${newText.trim()}` });
            }
            closeContextMenu();
        }
        
        function triggerDeleteMessage() {
            if(confirm("Delete message?") && currentChatUser) {
                const roomId = getChatRoomId(myChatId, currentChatUser.id);
                database.ref(`chats/${roomId}/${selectedMsgId}`).remove();
            }
            closeContextMenu();
        }

        // --- PROFILE ---
        function triggerPfpUpload() { document.getElementById('pfpFileInput').click(); }
        function uploadProfilePic(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('myProfilePic').src = e.target.result;
                    database.ref('users/' + myChatId).update({ pfp: e.target.result });
                };
                reader.readAsDataURL(input.files[0]);
            }
        }
        function updateProfileData() {
            const newName = document.getElementById('accountUsername').value.trim();
            const newBio = document.getElementById('accountBio').value.trim();
            if (newName.length < 3) return alert("Username min 3 chars.");
            database.ref('users/' + myChatId).update({ username: newName, bio: newBio }).then(() => {
                localStorage.setItem('myUsername', newName); alert("Profile saved!");
            });
        }
        function copyMyChatId() { navigator.clipboard.writeText(myChatId); alert("ID Copied: " + myChatId); }
        function logoutUser() { localStorage.clear(); window.location.href = "index.html"; }
    </script>
</body>
</html>
