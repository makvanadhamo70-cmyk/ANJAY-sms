<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      maximum-scale=1.0, user-scalable=no,
      viewport-fit=cover">

<meta name="theme-color" content="#09090b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>ANJAY - Chat</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Inter,Arial,sans-serif;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    min-height:100%;
    background:#09090b;
    color:#fff;
    overflow:hidden;
}

body{
    position:fixed;
    inset:0;
}

button,
input,
textarea{
    font-family:inherit;
}

button{
    -webkit-appearance:none;
}

.app-card{
    width:100%;
    height:100%;
    min-height:100%;
    background:
        radial-gradient(
            circle at 50% 0%,
            #1e1b4b 0%,
            #09090b 60%
        );
    display:flex;
    flex-direction:column;
    position:relative;
    overflow:hidden;
}

/* =========================
   MAIN TABS
========================= */

.tab-content{
    flex:1;
    min-height:0;
    overflow-y:auto;
    overflow-x:hidden;
    padding:16px;
    display:none;
    flex-direction:column;
    gap:12px;
    -webkit-overflow-scrolling:touch;
}

.tab-content.active{
    display:flex;
}

/* =========================
   HEADER / SEARCH
========================= */

.app-header{
    padding:14px 16px;
    border-bottom:1px solid rgba(255,255,255,.05);
    background:rgba(15,15,18,.90);
    display:flex;
    align-items:center;
    gap:10px;
}

.search-box{
    position:relative;
    flex:1;
}

.search-box input{
    width:100%;
    padding:11px 16px 11px 40px;
    border-radius:14px;
    border:1px solid rgba(255,255,255,.08);
    background:rgba(0,0,0,.45);
    color:#fff;
    font-size:14px;
    outline:none;
}

.search-box input:focus{
    border-color:rgba(56,189,248,.4);
}

.search-box input::placeholder{
    color:#64748b;
}

.search-icon{
    position:absolute;
    left:13px;
    top:50%;
    transform:translateY(-50%);
    color:#94a3b8;
    font-size:15px;
}

/* =========================
   TITLES
========================= */

.section-title{
    font-size:13px;
    color:#94a3b8;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.5px;
}

/* =========================
   USER CARD
========================= */

.user-item{
    display:flex;
    align-items:center;
    gap:14px;
    padding:12px;
    background:rgba(255,255,255,.035);
    border:1px solid rgba(255,255,255,.06);
    border-radius:16px;
    cursor:pointer;
    width:100%;
    min-height:76px;
    transition:background .15s ease;
}

.user-item:active{
    background:rgba(56,189,248,.10);
    transform:scale(.99);
}

.avatar{
    width:52px;
    height:52px;
    border-radius:50%;
    object-fit:cover;
    background:#27272a;
    flex-shrink:0;
}

.user-info{
    flex:1;
    min-width:0;
}

.user-info h4{
    font-size:15px;
    color:#f8fafc;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.user-info p{
    font-size:12px;
    color:#94a3b8;
    margin-top:4px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.unread-text{
    font-weight:800;
    color:#fff!important;
}

/* =========================
   SUGGESTIONS
========================= */

.suggestions-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:10px 0 8px;
}

.hide-all-btn{
    background:none;
    border:none;
    color:#ef4444;
    font-size:17px;
    cursor:pointer;
    padding:4px 6px;
}

/* =========================
   SETTINGS
========================= */

.settings-group{
    background:rgba(255,255,255,.035);
    border:1px solid rgba(255,255,255,.06);
    border-radius:16px;
    padding:8px;
    display:flex;
    flex-direction:column;
    gap:4px;
}

.setting-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 14px;
    border-radius:12px;
    cursor:pointer;
    color:#e2e8f0;
    font-size:14px;
    font-weight:600;
}

.setting-item:active{
    background:rgba(255,255,255,.06);
}

/* =========================
   BOTTOM NAV
========================= */

.nav-bar{
    height:65px;
    min-height:65px;
    background:rgba(15,15,18,.97);
    border-top:1px solid rgba(255,255,255,.08);
    display:flex;
    justify-content:space-around;
    align-items:center;
    z-index:20;
    padding-bottom:env(safe-area-inset-bottom);
}

.nav-item{
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:3px;
    color:#94a3b8;
    cursor:pointer;
    font-size:11px;
    font-weight:700;
    background:none;
    border:none;
    flex:1;
}

.nav-item svg{
    width:20px;
    height:20px;
    stroke:currentColor;
    stroke-width:2;
    fill:none;
}

.nav-item.active{
    color:#38bdf8;
}

/* =========================
   CHAT ROOM
========================= */

.chat-room{
    position:absolute;
    top:0;
    left:100%;
    width:100%;
    height:100%;
    background:#fdfafb;
    color:#000;
    display:flex;
    flex-direction:column;
    z-index:50;
    transition:left .22s ease;
    will-change:left;
}

.chat-room.active{
    left:0;
}

.chat-room-header{
    min-height:65px;
    padding:
        8px
        14px
        8px
        10px;
    background:#fff;
    border-bottom:1px solid #eee;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding-top:max(8px, env(safe-area-inset-top));
}

.header-left-part{
    display:flex;
    align-items:center;
    gap:10px;
    cursor:pointer;
    min-width:0;
}

.back-btn{
    background:none;
    border:none;
    color:#000;
    font-size:35px;
    line-height:1;
    width:32px;
    height:42px;
    cursor:pointer;
}

.chat-room-header .avatar{
    width:40px;
    height:40px;
    border:1px solid #eee;
}

.chat-header-names{
    min-width:0;
}

.chat-header-names h4{
    font-size:15px;
    color:#000;
    font-weight:800;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    max-width:170px;
}

.chat-header-names p{
    font-size:11px;
    color:#888;
    margin-top:2px;
}

.header-action-icons{
    display:flex;
    gap:16px;
    color:#000;
    align-items:center;
}

.header-action-icons svg{
    width:21px;
    height:21px;
    cursor:pointer;
}

/* =========================
   MESSAGES
========================= */

.chat-messages{
    flex:1;
    min-height:0;
    padding:16px 12px;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:10px;
    background:#fdfafb;
    -webkit-overflow-scrolling:touch;
}

.msg-row{
    display:flex;
    align-items:flex-end;
    gap:7px;
    max-width:82%;
}

.msg-row.me-row{
    align-self:flex-end;
    flex-direction:row-reverse;
}

.msg-row.heshe-row{
    align-self:flex-start;
}

.msg-avatar{
    width:25px;
    height:25px;
    border-radius:50%;
    object-fit:cover;
    flex-shrink:0;
}

.msg-bubble{
    padding:10px 14px;
    font-size:14.5px;
    line-height:1.4;
    word-break:break-word;
    white-space:pre-wrap;
    box-shadow:0 1px 2px rgba(0,0,0,.06);
    user-select:text;
}

.msg-bubble.me{
    background:#f9196b;
    color:#fff;
    border-radius:20px;
    border-bottom-right-radius:4px;
}

.msg-bubble.heshe{
    background:#fff;
    color:#000;
    border:1px solid #f0f0f0;
    border-radius:20px;
    border-bottom-left-radius:4px;
}

/* =========================
   INPUT
========================= */

.chat-input-area{
    padding:
        9px
        12px
        max(12px, env(safe-area-inset-bottom));
    background:#fff;
    border-top:1px solid #f0f0f0;
    display:flex;
    align-items:center;
}

.input-pill{
    flex:1;
    display:flex;
    align-items:center;
    background:#f1f2f6;
    border-radius:30px;
    padding:4px 8px 4px 7px;
    gap:8px;
}

.input-pill .cam-icon{
    background:#f9196b;
    color:#fff;
    width:32px;
    height:32px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:15px;
    flex-shrink:0;
}

.input-pill input{
    flex:1;
    min-width:0;
    border:none;
    background:transparent;
    color:#000;
    font-size:15px;
    padding:9px 0;
    outline:none;
}

.input-pill input::placeholder{
    color:#777;
}

.send-airplane-btn{
    background:none;
    border:none;
    color:#f9196b;
    font-size:25px;
    cursor:pointer;
    padding:4px 7px;
    transform:rotate(45deg);
}

/* =========================
   CONTEXT MENU
========================= */

.context-menu{
    position:fixed;
    background:#27272a;
    border:1px solid rgba(255,255,255,.1);
    border-radius:12px;
    padding:7px;
    display:none;
    z-index:1000;
    box-shadow:0 10px 25px rgba(0,0,0,.5);
    flex-direction:column;
    gap:4px;
    width:125px;
}

.context-menu button{
    background:none;
    border:none;
    color:#fff;
    padding:10px;
    text-align:left;
    border-radius:8px;
    cursor:pointer;
    font-size:13px;
}

.context-menu button:active{
    background:rgba(255,255,255,.1);
}

/* =========================
   PROFILE
========================= */

.instagram-profile{
    display:flex;
    flex-direction:column;
    gap:20px;
    padding-top:10px;
}

.profile-header-insta{
    display:flex;
    align-items:center;
    gap:20px;
}

.insta-avatar{
    width:85px;
    height:85px;
    border-radius:50%;
    object-fit:cover;
    border:2px solid #38bdf8;
    cursor:pointer;
    background:#27272a;
}

.insta-stats{
    display:flex;
    gap:20px;
    flex:1;
    justify-content:space-around;
    text-align:center;
}

.stat-box h3{
    font-size:18px;
    font-weight:800;
    color:#f8fafc;
}

.stat-box p{
    font-size:11px;
    color:#94a3b8;
}

.chat-id-box{
    background:rgba(0,0,0,.3);
    border:1px solid rgba(255,255,255,.08);
    padding:12px;
    border-radius:14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.copy-btn{
    background:#38bdf8;
    color:#09090b;
    border:none;
    padding:7px 12px;
    border-radius:8px;
    font-weight:800;
    font-size:11px;
    cursor:pointer;
}

.edit-profile-form{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-top:5px;
}

.edit-profile-form label{
    font-size:11px;
    color:#94a3b8;
    text-transform:uppercase;
    font-weight:700;
}

.edit-profile-form input,
.edit-profile-form textarea{
    width:100%;
    padding:12px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,.1);
    background:rgba(0,0,0,.4);
    color:#fff;
    font-size:14px;
    outline:none;
    resize:none;
}

.action-btn{
    background:#38bdf8;
    border:none;
    padding:14px;
    border-radius:10px;
    font-weight:800;
    color:#09090b;
    cursor:pointer;
    font-size:12px;
}

/* =========================
   LOADING
========================= */

.fast-loading{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    color:#64748b;
    font-size:12px;
}

.empty-state{
    text-align:center;
    color:#64748b;
    font-size:12px;
    padding:20px 5px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:380px){
    .user-item{
        padding:10px;
    }

    .avatar{
        width:48px;
        height:48px;
    }

    .chat-header-names h4{
        max-width:130px;
    }

    .header-action-icons{
        gap:10px;
    }
}
</style>
</head>

<body>

<div class="app-card">

    <!-- =========================
         CHATS TAB
    ========================== -->

    <div id="chatsTab" class="tab-content active">

        <div class="app-header"
             style="margin:-16px -16px 12px -16px;">

            <div class="search-box">
                <span class="search-icon">🔍</span>

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search chats or users..."
                    autocomplete="off"
                    oninput="searchUsers(this.value)"
                >
            </div>

        </div>

        <div id="activeChatsArea">
            <div class="fast-loading">
                Loading chats...
            </div>
        </div>

        <div id="suggestionsWrapper">

            <div class="suggestions-header">

                <span
                    class="section-title"
                    id="suggestionsTitle">
                    Suggestions
                </span>

                <button
                    class="hide-all-btn"
                    title="Remove suggestions"
                    onclick="hideAllSuggestions()">
                    ✖
                </button>

            </div>

            <div
                id="chatListArea"
                style="
                    display:flex;
                    flex-direction:column;
                    gap:10px;
                ">
            </div>

        </div>

    </div>


    <!-- =========================
         FRIENDS TAB
    ========================== -->

    <div id="friendsTab" class="tab-content">

        <h3 style="font-size:18px;margin-bottom:10px;">
            Friends
        </h3>

        <div class="settings-group">

            <div
                class="setting-item"
                onclick="showMessage('Friend requests coming soon!')">

                <span>👥 Friend Requests</span>

                <span style="color:#38bdf8;">
                    0 Pending
                </span>

            </div>

            <div
                class="setting-item"
                onclick="switchToChats()">

                <span>➕ Add New Friends</span>

                <span>🔍</span>

            </div>

        </div>

        <span
            class="section-title"
            style="margin-top:15px;">
            Your Friend List
        </span>

        <div
            id="friendsListArea"
            style="
                display:flex;
                flex-direction:column;
                gap:10px;
                margin-top:8px;
            ">

            <p style="color:#64748b;font-size:12px;">
                Active chats are automatically in your friends list.
            </p>

        </div>

    </div>


    <!-- =========================
         SETTINGS TAB
    ========================== -->

    <div id="settingsTab" class="tab-content">

        <h3 style="font-size:18px;margin-bottom:10px;">
            Settings
        </h3>

        <div class="settings-group">

            <div
                class="setting-item"
                onclick="showMessage('Notifications are enabled by default')">

                <span>🔔 Notifications</span>

                <span style="color:#10b981;">
                    On
                </span>

            </div>

            <div
                class="setting-item"
                onclick="resetSuggestions()">

                <span>🔄 Restore Hidden Suggestions</span>

                <span>›</span>

            </div>

            <div
                class="setting-item"
                onclick="clearLocalAppCache()">

                <span>⚡ Clear App Cache</span>

                <span>›</span>

            </div>

        </div>

    </div>


    <!-- =========================
         ACCOUNT TAB
    ========================== -->

    <div id="accountTab" class="tab-content">

        <div class="instagram-profile">

            <div class="profile-header-insta">

                <img
                    id="myProfilePic"
                    src="https://via.placeholder.com/85/27272a/38bdf8?text=PFP"
                    class="insta-avatar"
                    onclick="triggerPfpUpload()"
                >

                <input
                    type="file"
                    id="pfpFileInput"
                    style="display:none;"
                    accept="image/*"
                    onchange="uploadProfilePic(this)"
                >

                <div class="insta-stats">

                    <div class="stat-box">

                        <h3 id="chatsCountNum">
                            0
                        </h3>

                        <p>Chats</p>

                    </div>

                </div>

            </div>


            <div class="chat-id-box">

                <div>

                    <p style="
                        font-size:10px;
                        color:#94a3b8;
                    ">
                        YOUR CHAT ID
                    </p>

                    <h4
                        id="displayChatId"
                        style="
                            font-size:15px;
                            font-family:monospace;
                            color:#38bdf8;
                        ">
                        ------
                    </h4>

                </div>

                <button
                    class="copy-btn"
                    onclick="copyMyChatId()">
                    Copy
                </button>

            </div>


            <div class="edit-profile-form">

                <label>Username</label>

                <input
                    type="text"
                    id="accountUsername"
                    autocomplete="off"
                >

                <label>Bio</label>

                <textarea
                    id="accountBio"
                    rows="3">
                </textarea>

                <button
                    class="action-btn"
                    onclick="updateProfileData()">
                    Save Changes
                </button>

            </div>


            <button
                class="action-btn"
                style="
                    background:rgba(239,68,68,.15);
                    color:#ef4444;
                    margin-top:10px;
                "
                onclick="logoutUser()">

                Log Out

            </button>

        </div>

    </div>


    <!-- =========================
         BOTTOM NAV
    ========================== -->

    <div class="nav-bar">

        <button
            class="nav-item active"
            onclick="switchTab('chats',this)">

            <svg viewBox="0 0 24 24">
                <path d="
                    M21 15a2 2 0 0 1-2 2H7
                    l-4 4V5a2 2 0 0 1 2-2h14
                    a2 2 0 0 1 2 2z">
                </path>
            </svg>

            Chat

        </button>


        <button
            class="nav-item"
            onclick="switchTab('friends',this)">

            <svg viewBox="0 0 24 24">

                <path d="
                    M17 21v-2a4 4 0 0 0-4-4H5
                    a4 4 0 0 0-4 4v2">
                </path>

                <circle
                    cx="9"
                    cy="7"
                    r="4">
                </circle>

                <path d="
                    M23 21v-2a4 4 0 0 0-3-3.87">
                </path>

                <path d="
                    M16 3.13a4 4 0 0 1 0 7.75">
                </path>

            </svg>

            Friends

        </button>


        <button
            class="nav-item"
            onclick="switchTab('settings',this)">

            <svg viewBox="0 0 24 24">

                <circle
                    cx="12"
                    cy="12"
                    r="3">
                </circle>

                <path d="
                    M19.4 15a1.65 1.65 0 0 0
                    .33 1.82l.06.06a2 2 0 0 1
                    0 2.83 2 2 0 0 1-2.83 0l-.06-.06
                    a1.65 1.65 0 0 0-1.82-.33
                    1.65 1.65 0 0 0-1 1.51V21
                    a2 2 0 0 1-2 2 2 2 0 0 1-2-2
                    v-.09A1.65 1.65 0 0 0 9 19.4
                    a1.65 1.65 0 0 0-1.82.33l-.06.06
                    a2 2 0 0 1-2.83 0 2 2 0 0 1
                    0-2.83l.06-.06a1.65 1.65 0 0 0
                    .33-1.82 1.65 1.65 0 0 0-1.51-1H3
                    a2 2 0 0 1-2-2 2 2 0 0 1 2-2
                    h.09A1.65 1.65 0 0 0 4.6 9
                    a1.65 1.65 0 0 0-.33-1.82l-.06-.06
                    a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0
                    l.06.06a1.65 1.65 0 0 0 1.82.33H9
                    a1.65 1.65 0 0 0 1-1.51V3
                    a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09
                    a1.65 1.65 0 0 0 1 1.51
                    1.65 1.65 0 0 0 1.82-.33l.06-.06
                    a2 2 0 0 1 2.83 0 2 2 0 0 1
                    0 2.83l-.06.06a1.65 1.65 0 0 0
                   -.33 1.82V9a1.65 1.65 0 0 0
                    1.51 1H21a2 2 0 0 1 2 2
                    2 2 0 0 1-2 2h-.09
                    a1.65 1.65 0 0 0-1.51 1z">
                </path>

            </svg>

            Setting

        </button>


        <button
            class="nav-item"
            onclick="switchTab('account',this)">

            <svg viewBox="0 0 24 24">

                <path d="
                    M20 21v-2a4 4 0 0 0-4-4H8
                    a4 4 0 0 0-4 4v2">
                </path>

                <circle
                    cx="12"
                    cy="7"
                    r="4">
                </circle>

            </svg>

            Account

        </button>

    </div>


    <!-- =========================
         CHAT ROOM
    ========================== -->

    <div id="chatRoom" class="chat-room">

        <div class="chat-room-header">

            <div
                class="header-left-part"
                onclick="closeChatRoom()">

                <button class="back-btn">
                    ‹
                </button>

                <img
                    id="activeChatAvatar"
                    src="https://via.placeholder.com
